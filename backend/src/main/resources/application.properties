
quarkus.log.level=INFO
quarkus.http.limits.max-body-size=10M
quarkus.http.body.delete-uploaded-files-on-end=true

%dev.quarkus.log.category."com.lackstreet".level=DEBUG

%dev.quarkus.log.file.enabled=true
%dev.quarkus.log.file.path=logs/pdf-tools.log
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=5
%dev.quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c] [requestId=%X{requestId}] %s%e%n
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c] [requestId=%X{requestId}] %s%e%n