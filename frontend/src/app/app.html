<h1>{{ title() }} </h1>
<p role="status">{{ status() }}</p>

<p> Strumenti per lavorare con i tuoi PDF</p>
<button type="button" (click)="checkBackend()"[disabled]="loading()">
  Verifica backend
</button>

<label for="pdf-file"> Seleziona un PDF</label>

@if (selectedFile(); as file) {
  <p>Nome file: {{file.name}}</p>
  <p>Dimensione file: {{file.size / 1024}} KiB</p>
}@else{
  <p> Nessun file selezionato</p>
}
<input
  id="pdf-file"
  type="file"
  accept=".pdf,application/pdf"
  (change)="onFileSelected($event)"
/>




<router-outlet/>
